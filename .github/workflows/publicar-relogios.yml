# Publica a extensão Hyper Eternity Relógios na release fixa "relogios", sem criar release nova.
# Basta colocar o APK novo em dist/ (nome Hyper-Eternity-Relogios-<versão>.apk) neste ramo:
# a release é criada na primeira vez e, depois, o APK dentro dela é trocado.
# O app do Hyper Eternity procura a extensão nesta release primeiro.
name: Publicar extensão Relógios

on:
  push:
    branches: [relogios]
    paths: ['dist/**', '.github/workflows/publicar-relogios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar na release relogios
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          APK=$(ls dist/Hyper-Eternity-Relogios-*.apk | sort -V | tail -n 1)
          [ -n "$APK" ] || { echo "nenhum APK em dist/"; exit 1; }
          NAME=$(basename "$APK")
          VER=${NAME#Hyper-Eternity-Relogios-}; VER=${VER%.apk}
          if ! gh release view relogios -R "$REPO" >/dev/null 2>&1; then
            gh release create relogios -R "$REPO" --target "$GITHUB_SHA" --prerelease \
              --title "Hyper Eternity Relógios (versão mais nova)" \
              --notes "Release fixa da extensão Hyper Eternity Relógios. O APK daqui é sempre a versão mais nova: o app do Hyper Eternity procura nesta release primeiro. Novas versões trocam o arquivo, sem criar release nova."
          fi
          # só fica o APK mais novo
          for A in $(gh release view relogios -R "$REPO" --json assets --jq '.assets[].name'); do
            case "$A" in Hyper-Eternity-Relogios-*.apk) [ "$A" = "$NAME" ] || gh release delete-asset relogios "$A" -R "$REPO" -y ;; esac
          done
          gh release upload relogios "$APK" -R "$REPO" --clobber
          gh release edit relogios -R "$REPO" --title "Hyper Eternity Relógios $VER (versão mais nova)"
          echo "publicado: $NAME"
